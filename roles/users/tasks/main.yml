- name: Remove default users
  ansible.builtin.user:
    name: '{{ item }}'
    state: absent
  loop:
    - arch

- name: Create user for Dmitry Ilvokhin
  ansible.builtin.user:
    name: d
    home: /home/d
    groups:
      - wheel
      # Group http required to deploy websites with rsync under personal
      # username.
      - http

- name: Create user for Anastasiia Semenova
  ansible.builtin.user:
    name: a
    home: /home/a
  when: inventory_hostname in groups['home']
