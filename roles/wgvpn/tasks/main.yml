- name: Configure wgvpn0 netdev
  ansible.builtin.template:
    src: templates/99-wgvpn0.netdev.j2
    dest: /etc/systemd/network/99-wgvpn0.netdev
    owner: root
    group: systemd-network
    mode: u+rw,g+r,o-rw
  notify: Reload systemd-networkd

- name: Configure wgvpn0 network
  ansible.builtin.copy:
    src: files/99-wgvpn0.network
    dest: /etc/systemd/network/99-wgvpn0.network
    owner: root
    group: systemd-network
    mode: u+rw,g+r,o+r
  notify: Reload systemd-networkd

- name: Setup systemd-resolved drop-in config directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: u+rw,g+r,o+r

- name: Configure systemd-resolved for wgvpn0
  ansible.builtin.copy:
    src: files/wgvpn0.conf
    dest: /etc/systemd/resolved.conf.d/wgvpn0.conf
    owner: root
    group: root
    mode: u+rw,g+r,o+r
  notify: Restart systemd-resolved
