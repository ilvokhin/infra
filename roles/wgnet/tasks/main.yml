- name: Configure wgnet0 netdev
  ansible.builtin.template:
    src: templates/99-wgnet0.netdev.j2
    dest: /etc/systemd/network/99-wgnet0.netdev
    owner: root
    group: systemd-network
    mode: u+rw,g+r,o-rw
  notify: Reload systemd-networkd

- name: Configure wgnet0 network
  ansible.builtin.copy:
    src: files/99-wgnet0.network
    dest: /etc/systemd/network/99-wgnet0.network
    owner: root
    group: systemd-network
    mode: u+rw,g+r,o+r
  notify: Reload systemd-networkd
