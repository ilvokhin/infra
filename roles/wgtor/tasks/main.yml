- name: Configure nftables for wgtor0
  ansible.builtin.copy:
    src: files/nftables.conf
    dest: /etc/nftables-wgtor.conf
    owner: root
    group: root
    mode: u+rw,g+r,o+r

- name: Configure wireguard for wgtor0
  ansible.builtin.template:
    src: templates/wgtor0.conf.j2
    dest: /etc/wireguard/wgtor0.conf
    owner: root
    group: root
    mode: u+rw,g-rw,o-rw
  notify: Restart wgtor

- name: Enable wireguard service for wgtor
  ansible.builtin.service:
    name: wg-quick@wgtor0
    enabled: true
    state: started
