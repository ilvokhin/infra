- name: Configure wgtor0 netdev
  ansible.builtin.template:
    src: templates/99-wgtor0.netdev.j2
    dest: /etc/systemd/network/99-wgtor0.netdev
    owner: root
    group: systemd-network
    mode: u+rw,g+r,o-rw
  notify: Reload systemd-networkd

- name: Configure wgtor0 network
  ansible.builtin.copy:
    src: files/99-wgtor0.network
    dest: /etc/systemd/network/99-wgtor0.network
    owner: root
    group: systemd-network
    mode: u+rw,g+r,o+r
  notify: Reload systemd-networkd

- name: Configure nftables for wgtor0
  ansible.builtin.copy:
    src: files/nftables-wgtor0.conf
    dest: /etc/nftables-wgtor0.conf
    owner: root
    group: root
    mode: u+rw,g+r,o+r

- name: Configure nftables serice for wgtor0
  ansible.builtin.copy:
    src: files/nftables-wgtor0.service
    dest: /etc/systemd/system
    owner: root
    group: root
    mode: u+rw,g+r,o+r

- name: Enable nftables service for wgtor0
  ansible.builtin.service:
    name: nftables-wgtor0
    enabled: true
    state: started
    daemon_reload: true
