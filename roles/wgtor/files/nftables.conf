# See [1] for source of iptables rules. This is a conversion for nftables.
# [1]: https://gitlab.torproject.org/legacy/trac/-/wikis/doc/TransparentProxy

destroy table ip wgtor

table ip wgtor {
        chain prerouting {
                type nat hook prerouting priority dstnat; policy accept;
                iifname "wgtor0" udp dport 53 counter redirect to :5353
                iifname "wgtor0" tcp flags & (fin | syn | rst | ack) == syn counter redirect to :9040
        }

        chain output {
                type nat hook output priority dstnat; policy accept;
                ip daddr 10.192.0.0/10 meta l4proto tcp counter redirect to :9040
        }
}
